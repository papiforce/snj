<!doctype html>
<html lang="{L_LANG_HTML}">
  <head>
    <meta charset="{S_CONTENT_ENCODING}" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta http-equiv="content-type" content="text/html; charset={S_CONTENT_ENCODING}" />

    <!-- BEGIN switch_canonical_url -->
    <link rel="canonical" href="{switch_canonical_url.CANONICAL_URL}" />
    <!-- END switch_canonical_url -->

    {META_FAVICO} {META} {META_FB_LIKE}

    <title>{SITENAME_TITLE}{PAGE_TITLE}</title>

    {T_HEAD_STYLESHEET} {CSS}

    <meta name="theme-color" content="{GG_THEME_COLOR}" />

    <link rel="search" type="application/opensearchdescription+xml" href="/improvedsearch.xml" title="{SITENAME}" />
    <link rel="search" type="application/opensearchdescription+xml" href="{URL_BOARD_DIRECTORY}/search/improvedsearch.xml" title="{SEARCH_FORUMS}" />

      .forum-description img {

  </head>

  <body id="top">
    {GREETING_POPUP}

    <nav id="custom-navbar">
      <div class="navbar-inner">
        <button class="nav-burger" id="nav-burger-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier">
              <path d="M4 18L20 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
              <path d="M4 12L20 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
              <path d="M4 6L20 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
            </g>
          </svg>
        </button>

        <div class="nav-center">
          <a class="nav-link" href="{U_INDEX}">
            <ion-icon name="home-outline"></ion-icon>
            Accueil
          </a>
          <a class="nav-link" href="/search">
            <ion-icon name="search-outline"></ion-icon>
            Rechercher
          </a>
          <a class="nav-link" href="/memberlist">
            <ion-icon name="people-outline"></ion-icon>
            Membres
          </a>
        </div>
        <div class="nav-right" id="nav-auth"></div>
      </div>
    </nav>

    <div class="nav-overlay" id="nav-overlay"></div>

    <nav class="nav-drawer" id="nav-drawer">
      <button class="nav-drawer-close" id="nav-drawer-close" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path d="M20.7457 3.32851C20.3552 2.93798 19.722 2.93798 19.3315 3.32851L12.0371 10.6229L4.74275 3.32851C4.35223 2.93798 3.71906 2.93798 3.32854 3.32851C2.93801 3.71903 2.93801 4.3522 3.32854 4.74272L10.6229 12.0371L3.32856 19.3314C2.93803 19.722 2.93803 20.3551 3.32856 20.7457C3.71908 21.1362 4.35225 21.1362 4.74277 20.7457L12.0371 13.4513L19.3315 20.7457C19.722 21.1362 20.3552 21.1362 20.7457 20.7457C21.1362 20.3551 21.1362 19.722 20.7457 19.3315L13.4513 12.0371L20.7457 4.74272C21.1362 4.3522 21.1362 3.71903 20.7457 3.32851Z" fill="#FFFFFF"></path>
          </g>
        </svg>
      </button>
      <div id="nav-drawer-user-block"></div>
      <a class="nav-drawer-link" href="{U_INDEX}">Accueil</a>
      <a class="nav-drawer-link" href="/search">Rechercher</a>
      <a class="nav-drawer-link" href="/memberlist">Membres</a>
      <div id="nav-drawer-auth-block"></div>
    </nav>

    <script type="text/javascript">
      $(function () {
        var $auth = $("#nav-auth");
        var $drawerAuth = $("#nav-drawer-auth-block");
        var $drawerUser = $("#nav-drawer-user-block");

        if (_userdata.session_logged_in == 1) {
          var avatarSrc = _userdata.avatar_link;
          var username = _userdata.username;
          var avatarHtml = avatarSrc ? '<img class="nav-avatar__img" src="' + avatarSrc + '" alt="' + username + '">' : '<span class="nav-avatar__initials">' + username.charAt(0).toUpperCase() + "</span>";

          $auth.html('<div class="nav-avatar-wrap">' + '<button class="nav-avatar" id="nav-avatar-btn" aria-expanded="false">' + avatarHtml + "</button>" + '<div class="nav-dropdown" id="nav-dropdown">' + '<a class="nav-dropdown__item" href="/u' + _userdata.user_id + '">Profil</a>' + '<a class="nav-dropdown__item" href="' + _userdata.page_edit_profile + '">Éditer le profil</a>' + '<div class="nav-dropdown__divider"></div>' + '<a class="nav-dropdown__item nav-dropdown__item--danger" href="' + _userdata.page_logout + '">Déconnexion</a>' + "</div>" + "</div>");

          $drawerUser.html('<div class="nav-drawer-user">' + '<div class="nav-drawer-user__avatar">' + avatarHtml + "</div>" + '<span class="nav-drawer-user__name">' + username + "</span>" + "</div>");

          $("#nav-avatar-btn").on("click", function (e) {
            e.stopPropagation();
            var $dd = $("#nav-dropdown");
            var open = $dd.hasClass("is-open");
            $dd.toggleClass("is-open", !open);
            $(this).attr("aria-expanded", String(!open));
          });

          $(document).on("click", function () {
            $("#nav-dropdown").removeClass("is-open");
            $("#nav-avatar-btn").attr("aria-expanded", "false");
          });
        } else {
          $auth.html('<a class="nav-link nav-link--register" href="' + _userdata.register + '">Inscription</a>' + '<a class="nav-link nav-link--btn" href="' + _userdata.page_login + '">Connexion</a>');

          $drawerAuth.html('<div style="padding: 16px 24px; border-top: 1px solid rgba(200,169,81,0.15); margin-top: 8px; display: flex; gap: 8px;">' + '<a class="nav-link nav-link--register" href="' + _userdata.register + '">Inscription</a>' + '<a class="nav-link nav-link--btn" href="' + _userdata.page_login + '">Connexion</a>' + "</div>");
        }

        function openDrawer() {
          $("#nav-drawer").addClass("is-open");
          $("#nav-overlay").addClass("is-open");
        }
        function closeDrawer() {
          $("#nav-drawer").removeClass("is-open");
          $("#nav-overlay").removeClass("is-open");
        }

        $("#nav-burger-btn").on("click", openDrawer);
        $("#nav-drawer-close").on("click", closeDrawer);
        $("#nav-overlay").on("click", closeDrawer);

        var $navbar = $("#custom-navbar");
        $(window).on("scroll", function () {
          $navbar.toggleClass("is-scrolled", $(window).scrollTop() > 0);
        });
      });
    </script>

    <div id="banner-background" style="background: url(&quot;https://i.pinimg.com/1200x/60/4f/74/604f74ad57ec55d715cde3c3d1580751.jpg&quot;); position: absolute; top: 0; left: 0; bottom: 0; right: 0; z-index: 0; width: 100%; height: 100vh; background-position: center; background-repeat: no-repeat; background-size: cover"></div>

    <div style="position: relative; width: 100%; max-width: 1140px; margin: 12rem auto">
      <h1 style="font-size: 60px !important; width: max-content; position: relative; z-index: 1; color: #ffffff !important; letter-spacing: 0px !important">Sengoku no Jidai</h1>
      <p style="text-align: right; margin-top: 12px; position: relative; z-index: 1">
        戦国の時代 ·
        <i>L'Ère des Royaumes en Guerre</i>
      </p>

      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Aperture_Science_Logo.svg/960px-Aperture_Science_Logo.svg.png" alt="" aria-hidden="true" style="position: absolute; top: 50%; left: 8px; transform: translate(-50%, -50%); opacity: 0.15; max-width: 480px; width: 100%; z-index: 0" />
    </div>

    <div id="wrap">
      <!-- BEGIN html_validation -->
    </div>
    <!-- <div id="wrap" /> -->
  </body>
</html>
<!-- END html_validation -->
