<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO de base -->
    <title>Sengoku no Jidai · Forum RPG Naruto | L'Ère des Royaumes en Guerre</title>
    <meta name="description" content="Sengoku no Jidai est un forum de jeu de rôle textuel inspiré de l'univers Naruto. Incarnez un shinobi, rejoignez un clan parmi les cinq pays et écrivez l'histoire de l'Ère des Royaumes en Guerre." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sengoku no Jidai · Forum RPG Naruto" />
    <meta property="og:description" content="Forum de jeu de rôle textuel inspiré de l'univers Naruto. Incarnez un shinobi et écrivez l'histoire de l'Ère des Royaumes en Guerre." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://i.pinimg.com/1200x/60/4f/74/604f74ad57ec55d715cde3c3d1580751.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sengoku no Jidai · Forum RPG Naruto" />
    <meta name="twitter:description" content="Forum de jeu de rôle textuel inspiré de l'univers Naruto. Incarnez un shinobi et écrivez l'histoire de l'Ère des Royaumes en Guerre." />
    <meta name="twitter:image" content="https://i.pinimg.com/1200x/60/4f/74/604f74ad57ec55d715cde3c3d1580751.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Aperture_Science_Logo.svg/960px-Aperture_Science_Logo.svg.png" />
    <link rel="canonical" href="https://sengoku-no-jidai.forumactif.com/" />

    <!-- Google Fonts via link (plus rapide que @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" />

    <!-- Données structurées JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sengoku no Jidai",
        "description": "Forum de jeu de rôle textuel inspiré de l'univers Naruto, situé dans l'Ère des Royaumes en Guerre.",
        "inLanguage": "fr-FR",
        "keywords": "forum rpg, naruto, shinobi, sengoku, jeu de rôle, jdr, clan"
      }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Exo 2", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-weight: 500;
      }

      a {
        text-decoration: none;
        color: #ffffff;
      }

      body {
        background: #000000;
        color: #ffffff;
        font-family: "Nunito", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        overflow-x: hidden;
      }

      .hero {
        width: 100%;
        height: 100vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url("https://i.pinimg.com/1200x/60/4f/74/604f74ad57ec55d715cde3c3d1580751.jpg") center no-repeat;
        background-size: cover;
        filter: grayscale(0.6);
      }

      .hero__overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.3);
      }

      .hero__gradient {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 180px;
        background: linear-gradient(to bottom, transparent, #000000);
        z-index: 1;
      }

      .hero__content {
        z-index: 1;
        position: relative;
      }

      .hero__title {
        font-size: 60px;
        text-transform: uppercase;
        width: max-content;
        position: relative;
        z-index: 1;
      }

      .hero__subtitle {
        text-align: right;
        margin-top: 12px;
        position: relative;
        z-index: 1;
      }

      .hero__bg-logo {
        position: absolute;
        top: 50%;
        left: 8px;
        transform: translate(-50%, -50%);
        opacity: 0.15;
        max-width: 480px;
        width: 100%;
        z-index: 0;
      }

      .container {
        max-width: 1140px;
        width: 100%;
        margin: 56px auto;
      }

      .section-sm {
        max-width: 640px;
        width: 100%;
        margin: 0 auto;
      }

      .section-md {
        max-width: 768px;
        width: 100%;
        margin: 80px auto 0;
      }

      .section-join {
        max-width: 640px;
        width: 100%;
        margin: 80px auto;
      }

      .section-title {
        font-size: 32px;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
        color: #c8a951;
        text-align: center;
        font-weight: 300;
      }

      .divider {
        position: relative;
        display: flex;
        align-items: center;
        margin: 32px 0;
      }

      .divider__line {
        flex: 1;
        height: 1px;
        background: #d4b96b;
      }

      .divider__dot {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #d4b96b;
      }

      .section-text {
        font-size: 16px;
        text-align: justify;
        padding: 0 16px;
      }

      .section-text-center {
        font-size: 16px;
        text-align: center;
        padding: 0 16px;
        margin: 24px 0 32px;
      }

      .section-text-sm {
        font-size: 16px;
        text-align: center;
      }

      .text-center {
        text-align: center;
      }

      .accent {
        color: #c8a951;
      }

      .map-wrapper {
        position: relative;
        display: inline-block;
        width: 100%;
      }

      .map-label {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .map-label--hi {
        bottom: 25%;
        left: 43%;
      }

      .map-label--mizu {
        bottom: 22%;
        right: 6.5%;
      }

      .map-label--kaminari {
        top: 22%;
        right: 16%;
        color: #000000;
      }

      .map-label--tsuchi {
        top: 22%;
        left: 8%;
      }

      .map-label--kaze {
        bottom: 16%;
        left: 10%;
      }

      .label-sm {
        font-size: 12px;
        font-weight: 500px;
      }

      .countries-grid {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: space-around;
      }

      .country-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .country-name {
        font-size: 14px;
        text-align: center;
      }

      .country-name__sub {
        font-size: 12px;
      }

      .progress-label {
        text-transform: uppercase;
        margin: 40px 0 16px;
        text-align: center;
        color: #c8a951;
      }

      .progress-bar {
        overflow: hidden;
        border-radius: 9999px;
        width: calc(100% - 32px);
        height: 6px;
        background: rgba(255, 255, 255, 0.3);
        margin: 0px auto 12px;
      }

      .progress-bar__fill {
        border-radius: 9999px;
        width: 40%;
        height: 6px;
        background: orange;
      }

      .btn-discord {
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        width: max-content;
        border-radius: 8px;
        color: #ffffff;
        text-decoration: none;
        margin: 32px auto 0;
        background-color: #5865f2;
      }

      .footer-logo {
        margin: 60px auto 0px;
        max-width: max-content;
      }

      .footer-logo__img {
        width: 32px;
        height: 32px;
        opacity: 0.3;
      }

      /* ── Responsive ─────────────────────────────────────────────── */

      @media (max-width: 768px) {
        .hero__title {
          font-size: 36px;
        }

        .hero__subtitle {
          font-size: 13px;
        }

        .hero__bg-logo {
          max-width: 280px;
          left: 50%;
        }

        .container {
          margin: 40px auto;
        }

        .section-sm,
        .section-md,
        .section-join {
          padding: 0 16px;
        }

        .section-title {
          font-size: 24px;
        }

        .section-md {
          margin-top: 56px;
        }

        .section-join {
          margin: 56px auto;
        }

        .map-label {
          gap: 2px;
        }

        .map-label .label-sm {
          font-size: 9px;
        }

        .map-label svg,
        .map-label img {
          width: 18px;
          height: 18px;
        }

        .countries-grid {
          gap: 16px;
        }

        .btn-discord {
          width: 100%;
          justify-content: center;
        }
      }

      @media (max-width: 480px) {
        .hero__title {
          font-size: 28px;
        }

        .hero__subtitle {
          font-size: 12px;
          margin-top: 8px;
        }

        .hero__bg-logo {
          max-width: 200px;
        }

        .section-title {
          font-size: 20px;
        }

        .section-text,
        .section-text-center,
        .section-text-sm {
          font-size: 14px;
        }

        .map-label .label-sm {
          font-size: 8px;
        }

        .divider {
          margin: 20px 0;
        }

        .progress-label {
          margin: 24px 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="hero__overlay"></div>

      <div class="hero__gradient"></div>

      <div class="hero__content">
        <h1 class="hero__title">Sengoku no Jidai</h1>

        <p class="hero__subtitle">
          戦国の時代 ·
          <i>L'Ère des Royaumes en Guerre</i>
        </p>

        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Aperture_Science_Logo.svg/960px-Aperture_Science_Logo.svg.png" alt="" aria-hidden="true" class="hero__bg-logo" />
      </div>
    </div>

    <div class="container">
      <div class="heading" style="display: flex; align-items: center; padding: 16px 12px 16px 32px; gap: 24px">
        <h2>Les principes</h2>
        <img src="https://i.servimg.com/u/f46/20/42/42/01/brandw10.png" alt="Astrebrume Brandw10" />
        <p>
          Dans les profondeurs sombra le nom de celui qui créa l'immondice.
          <br />
          Son souvenir oublié, le monde put ainsi connaître la salvation.
        </p>
        <a href="#" class="btn-md tertiary"><i class="ion-ios-minus-outline"></i></a>
      </div>
    </div>
  </body>
</html>
