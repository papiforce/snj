<div class="main-tooltip">
  <div class="tooltip-content">
    <span class="tooltip-title">{USER_NAME_COLORED}</span>
    <!-- BEGIN switch_rank_info -->
    <span class="tooltip-subtitle"
      >{switch_rank_info.L_RANK}: {switch_rank_info.RANK_TITLE}</span
    >
    <!-- END switch_rank_info -->
    <div class="avatar-big">
      <img src="{USER_AVATAR}" alt="{USER_NAME}" loading="lazy" />
    </div>
    <!-- BEGIN switch_followers -->
    <div class="block-follow">
      <button
        onclick="doFollowAction(this)"
        data-id="{USER_ID}"
        id="followBtn"
        class="{C_FOLLOW} button1"
      >
        <i class="material-icons">notifications{C_FOLLOW_ICON}</i>{L_FOLLOW_TXT}
      </button>
    </div>
    <!-- END switch_followers -->
    <div class="post-author-details">
      <span class="label">{L_POSTS}:</span> {POSTS}
      <!-- BEGIN switch_allow_friends -->
      <br />
      <span class="label">{L_FRIENDS}:</span> {FRIENDS}
      <!-- END switch_allow_friends -->
    </div>
    <ul class="post-author-contact-inline">
      <!-- BEGIN switch_button_tooltip_PROFILE -->
      <li>
        <a
          href="{switch_button_tooltip_PROFILE.URL}"
          title="{switch_button_tooltip_PROFILE.LANG}"
        >
          <img
            src="{switch_button_tooltip_PROFILE.IMAGE}"
            alt="{switch_button_tooltip_PROFILE.LANG}"
            loading="lazy"
          />
        </a>
      </li>
      <!-- END switch_button_tooltip_PROFILE -->
      <!-- BEGIN switch_button_tooltip_PM -->
      <li>
        <a
          href="{switch_button_tooltip_PM.URL}"
          title="{switch_button_tooltip_PM.LANG}"
        >
          <img
            src="{switch_button_tooltip_PM.IMAGE}"
            alt="{switch_button_tooltip_PM.LANG}"
            loading="lazy"
          />
        </a>
      </li>
      <!-- END switch_button_tooltip_PM -->
      <!-- BEGIN switch_button_tooltip_FRIEND -->
      <li>
        <a
          href="{switch_button_tooltip_FRIEND.URL}"
          title="{switch_button_tooltip_FRIEND.LANG}"
        >
          <img
            src="{switch_button_tooltip_FRIEND.IMAGE}"
            alt="{switch_button_tooltip_FRIEND.LANG}"
            loading="lazy"
          />
        </a>
      </li>
      <!-- END switch_button_tooltip_FRIEND -->
      <!-- BEGIN switch_button_tooltip_MESSAGES -->
      <li>
        <a
          href="{switch_button_tooltip_MESSAGES.URL}"
          rel="nofollow"
          title="{switch_button_tooltip_MESSAGES.LANG}"
        >
          <img
            src="{switch_button_tooltip_MESSAGES.IMAGE}"
            alt="{switch_button_tooltip_MESSAGES.LANG}"
            loading="lazy"
          />
        </a>
      </li>
      <!-- END switch_button_tooltip_MESSAGES -->
      <!-- BEGIN switch_button_tooltip_FACEBOOK -->
      <li>
        <a
          href="{switch_button_tooltip_FACEBOOK.URL}"
          target="_blank"
          title="{switch_button_tooltip_FACEBOOK.LANG}"
        >
          <img
            src="{switch_button_tooltip_FACEBOOK.IMAGE}"
            alt="{switch_button_tooltip_FACEBOOK.LANG}"
            loading="lazy"
          />
        </a>
      </li>
      <!-- END switch_button_tooltip_FACEBOOK -->
      <!-- BEGIN switch_button_tooltip_TWITTER -->
      <li>
        <a
          href="{switch_button_tooltip_TWITTER.URL}"
          target="_blank"
          title="{switch_button_tooltip_TWITTER.LANG}"
        >
          <img
            src="{switch_button_tooltip_TWITTER.IMAGE}"
            alt="{switch_button_tooltip_TWITTER.LANG}"
            loading="lazy"
          />
        </a>
      </li>
      <!-- END switch_button_tooltip_TWITTER -->
    </ul>
  </div>
</div>
